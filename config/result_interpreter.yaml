# AXION Result Interpreter — рабочая конфигурация.
# Секреты здесь НЕ хранятся: API key берётся из переменной окружения ниже.
version: 1

result_interpreter:
  # true — LLM-интерпретация доступна; false — полностью выключена.
  enabled: true

  # Политика исходящих данных. Для внешнего LLM разрешён только REDACTED_V1.
  external_data_policy: REDACTED_V1

  # Провайдер и модель для локальной и общей интерпретации результата.
  provider: openai
  model: gpt-6-luna

  # Имя переменной окружения / секрета, где хранится ключ провайдера.
  api_key_env: OPENAI_API_KEY

  reasoning:
    # Для нашей задачи выбран low: хороший баланс качества, скорости и цены.
    effort: low

  generation:
    # Жёсткий предел ответа провайдера. Промпты дополнительно просят короткий ответ.
    max_output_tokens: 2400

  transport:
    # Таймаут одного запроса к провайдеру.
    timeout_seconds: 60
