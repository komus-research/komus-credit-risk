[project]
name = "komus-credit-risk"
version = "0.1.0"
requires-python = ">=3.12.2"
dependencies = [
    "catboost>=1.2.10",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai==3.8.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=18.0.0",
    "pytabkit==1.7.3",
    "pyxlsb>=1.0.10",
    "rtdl-revisiting-models==0.0.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "streamlit>=1.63.0",
    "tabm==0.0.3",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
