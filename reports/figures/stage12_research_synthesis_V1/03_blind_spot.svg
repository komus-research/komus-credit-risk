<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.n{font-size:25px;font-weight:700}.s{font-size:18px}</style><rect width="1400" height="760" fill="white"/><text x="70" y="65" class="h">Stage 3: от всех дефолтов к общей blind spot</text><text x="70" y="98" class="s">Рабочая выборка; OOF consensus rank трёх GBDT.</text><path d="M130 180 H1270 L1110 570 H290 Z" fill="#eef4ff" stroke="#3d6fb6" stroke-width="3"/><path d="M285 330 H1115 L1000 570 H400 Z" fill="#fff2d9" stroke="#c77c11" stroke-width="3"/><path d="M400 455 H1000 L900 570 H500 Z" fill="#fde9e5" stroke="#bd5039" stroke-width="3"/><text x="590" y="250" class="n">28 015 defaults</text><text x="560" y="400" class="n">1 278 deeply missed defaults</text><text x="580" y="530" class="n">805 common blind spot</text><text x="70" y="650" class="s">63.0% deeply missed defaults входят в common blind spot; сильное межмодельное disagreement среди deeply missed — 1.9%.</text><text x="70" y="685" class="s">Это поддерживает гипотезу общего information gap, но не доказывает причинность или конкретный недостающий фактор.</text></svg>
