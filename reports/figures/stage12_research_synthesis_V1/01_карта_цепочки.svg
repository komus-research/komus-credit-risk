<rect x="180" y="570" width="1040" height="150" rx="14" class="m"/><text x="220" y="615" class="h">Итог: CORE_MODEL_RESEARCH_STOPPED_CURRENT_47_FEATURES</text><text x="220" y="655" class="s">На текущих 47 признаках следующая architecture имеет низкий ожидаемый information gain.</text><text x="220" y="685" class="s">Data research остаётся открыт: новые валидные признаки, temporal anchor и новые проверяемые гипотезы.</text>
