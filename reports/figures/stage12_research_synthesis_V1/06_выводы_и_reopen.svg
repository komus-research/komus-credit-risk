<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:29px;font-weight:700}.n{font-size:21px;font-weight:700}.s{font-size:17px}.f{fill:#e8f1ff;stroke:#3d6fb6;stroke-width:2}.i{fill:#eef9f0;stroke:#26804a;stroke-width:2}.l{fill:#fff3df;stroke:#c77c11;stroke-width:2}.r{fill:#fbe9ec;stroke:#b13f55;stroke-width:2}</style><rect width="1400" height="820" fill="white"/><text x="55" y="55" class="h">FACT → INTERPRETATION → LIMITATION → Reopen conditions</text><rect x="60" y="105" width="395" height="250" rx="12" class="f"/><text x="85" y="145" class="n">FACT</text><text x="85" y="180" class="s">• baseline Gini ≈0.804</text><text x="85" y="210" class="s">• 805 common blind spot</text><text x="85" y="240" class="s">• Stage 5: material_missing_signal</text><text x="85" y="270" class="s">• architectures не дали material gain</text><rect x="505" y="105" width="395" height="250" rx="12" class="i"/><text x="530" y="145" class="n">INTERPRETATION</text><text x="530" y="180" class="s">Evidence сильнее поддерживает</text><text x="530" y="210" class="s">information/feature limitation, чем</text><text x="530" y="240" class="s">недостаток проверенных architectures.</text><text x="530" y="285" class="n">CORE_MODEL_RESEARCH_STOPPED</text><rect x="950" y="105" width="395" height="250" rx="12" class="l"/><text x="975" y="145" class="n">LIMITATION</text><text x="975" y="180" class="s">• нет temporal anchor</text><text x="975" y="210" class="s">• random OOF ≠ temporal stability</text><text x="975" y="240" class="s">• oracle не deployable</text><text x="975" y="270" class="s">• importance ≠ causality</text><rect x="220" y="455" width="960" height="245" rx="14" class="r"/><text x="250" y="495" class="n">Когда снова открывать model research</text><text x="250" y="535" class="s">1. Новый валидный feature source   2. Надёжный row-level temporal anchor   3. Сильный независимый противоречащий результат</text><text x="250" y="575" class="s">4. Изменение формального business objective   5. Новая конкретная научная гипотеза, меняющая решение</text><text x="250" y="635" class="n">Data research остаётся открыт; новый model shortlist ради количества не создаётся.</text></svg>
